# Ontologie : assistant de réservation de terrains de football (Foot 7joz, Liban)
# Format de sortie : intention | slot=valeur | slot=valeur
# Règles d'annotation :
#   - la valeur d'un slot est recopiée du message, en minuscules, sans article ;
#   - les slots sont écrits dans l'ordre de la liste ci-dessous, seulement ceux présents ;
#   - hors_domaine n'a jamais de slot.
# Ordre de décision (pour que deux personnes choisissent la même étiquette) :
#   1. le message parle d'une réservation que j'ai DÉJÀ faite ?
#        paiement -> changer_paiement ; annulation -> annuler_reservation ;
#        changer l'heure, la durée ou le terrain -> hors_domaine ; sinon -> consulter_reservations
#   2. il demande de réserver -> reserver_terrain (même s'il parle aussi de prix)
#   3. il demande un prix, le moins cher -> demander_prix
#   4. il demande si c'est libre, quels créneaux -> verifier_disponibilite
#   5. il cherche, liste, localise des terrains -> chercher_terrain
#   6. sinon -> hors_domaine

domaine: réservation de terrains de football au Liban

intentions:
  chercher_terrain: trouver ou lister des terrains par lieu, nom, type ou nombre de joueurs, sans question sur un créneau
  verifier_disponibilite: demander si un terrain est libre ou quels créneaux restent, sans demander de réserver
  demander_prix: demander combien coûte un terrain ou une durée, ou lequel est le moins cher
  reserver_terrain: demander de faire une nouvelle réservation
  consulter_reservations: voir ses propres réservations, son prochain match ou le statut d'une réservation
  annuler_reservation: annuler une de ses propres réservations
  changer_paiement: changer le moyen de paiement (cash ou Whish) d'une réservation existante
  hors_domaine: tout le reste (salutations, hors sujet, déplacer ou prolonger une réservation, liste d'attente, avis, remboursement)

slots:
  ville: ville ou quartier, tel qu'écrit (beyrouth, hamra, jounieh)
  nom_terrain: nom du complexe ou du terrain, tel qu'écrit (goal zone)
  type_terrain: couvert ou plein air, tel qu'écrit (couvert, intérieur, en salle, extérieur, plein air)
  nb_joueurs: nombre de joueurs, tel qu'écrit (10, 5 contre 5)
  date: jour, tel qu'écrit (demain, vendredi, ce soir, 25 décembre)
  heure: heure de début, telle qu'écrite (20h, 19h30)
  duree: durée du match, telle qu'écrite (90 minutes, 1h30, deux heures)
  paiement: moyen de paiement, tel qu'écrit (whish, cash, espèces, sur place)
